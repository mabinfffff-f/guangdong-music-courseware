<div class="copy"><h2>广东音乐的灵魂声线</h2><p>高胡是广东音乐中最具代表性的主奏乐器之一，音色明亮、清脆、灵活，常承担旋律主线。</p><dl class="facts"><div class="fact"><dt>乐器类别</dt><dd>拉弦乐器</dd></div><div class="fact"><dt>发声方式</dt><dd>琴弓擦弦</dd></div><div class="fact"><dt>音色特点</dt><dd>明亮清脆、灵活</dd></div><div class="fact"><dt>合奏作用</dt><dd>引领旋律主线</dd></div></dl><p class="note" id="note" aria-live="polite"></p></div></section>
<footer><a href="scene-05-guangdong-orchestra.html">← 返回广东民族乐团总览</a><span>广东音乐线上展厅</span></footer></main>
<script>
const instrument=document.querySelector(".instrument");
const audio=new Audio("gaohu.mp3");
audio.preload="auto";
function toggleGaohu(){
  if(audio.paused) audio.play().catch(()=>{});
  else {audio.pause();audio.currentTime=0;}
}
instrument.addEventListener("click",toggleGaohu);
instrument.addEventListener("keydown",event=>{
  if(event.key==="Enter"||event.key===" "){event.preventDefault();toggleGaohu();}
});
