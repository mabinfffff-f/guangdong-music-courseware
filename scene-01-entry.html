<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广东音乐线上展厅 · 入馆</title>
<style>
:root{--ivory:#f4ead5;--red:#9e392d;--gold:#d2b77a;--ink:#182c25}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Serif SC","Songti SC",serif;background:#18231f;color:var(--ivory)}.scene{position:relative;width:100%;height:100%;isolation:isolate;overflow:hidden;cursor:grab;touch-action:none}.scene.dragging{cursor:grabbing}.panorama{position:absolute;z-index:-2;inset:0;background:url('scene-01-panoramic-foyer.png') center/100% 100% no-repeat;transform:scale(1.055)}.scene:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(13,25,21,.23),transparent 22%,transparent 68%,rgba(9,18,16,.54)),linear-gradient(90deg,rgba(10,20,17,.28),transparent 26%,transparent 74%,rgba(10,20,17,.28));pointer-events:none}.topline{position:absolute;left:5vw;right:5vw;top:24px;display:flex;justify-content:space-between;align-items:center;font:12px system-ui;letter-spacing:2px}.brand{display:flex;gap:11px;align-items:center}.seal{width:28px;height:28px;border:1px solid #d8c28c;color:#dfc98f;display:grid;place-items:center;font-size:16px}.topmeta{opacity:.8}.hero{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(62vw,760px);text-align:center;color:#34271c}.eyebrow{display:flex;justify-content:center;gap:13px;color:#795839;font:10px system-ui;letter-spacing:3px;opacity:.95}.eyebrow:before{content:"";height:1px;width:42px;background:#a47b4d;opacity:.8}.eyebrow:after{display:none}h1{font-size:clamp(34px,4.7vw,66px);font-weight:400;line-height:1.18;margin:22px 0 15px;letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,255,255,.45)}.sub{font-size:clamp(12px,1.25vw,16px);letter-spacing:1px;color:#5d4934;margin:0 0 28px}.enter{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);border:1px solid rgba(236,220,186,.34);background:rgba(26,31,25,.28);color:rgba(255,248,233,.76);padding:9px 21px;min-width:130px;font:12px "Noto Serif SC";letter-spacing:2px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.12);transition:background .2s,color .2s}.enter:hover{background:rgba(115,48,36,.82);color:#fff8e9;box-shadow:0 6px 18px rgba(20,20,15,.28)}.enter:focus-visible{outline:3px solid #d2b77a;outline-offset:4px}.enter span{padding-left:12px}.drag-hint{margin-top:20px;color:#7b6851;font:11px system-ui;letter-spacing:1px}.chapters{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;padding:8px 18px;background:rgba(19,37,30,.83);border:1px solid rgba(219,198,145,.42);backdrop-filter:blur(10px)}.chapter{display:flex;gap:10px;padding:8px 20px;color:#e8dfcb;font:13px system-ui;cursor:pointer}.chapter+.chapter{border-left:1px solid rgba(224,207,168,.3)}.chapter:hover{color:#fff0bd;background:rgba(255,255,255,.06)}.num{color:#d2b77a}.active{color:#f2d99e}.toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-12px);padding:10px 18px;background:#172a23;color:#f4ead5;font:13px system-ui;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){.enter{bottom:12px}.topline{top:18px}.topmeta{display:none}.hero{left:50%;top:48%;width:84vw}h1{font-size:38px}.sub{letter-spacing:1px}.chapters{bottom:14px;width:calc(100% - 24px);justify-content:center;padding:6px 4px}.chapter{gap:6px;padding:8px 10px;font-size:11px}}
/* Keep the two side cabinets in view without stretching the photograph. */
.scene{background:#18231f url('scene-01-panoramic-foyer.png') center/cover no-repeat}
.scene .panorama{background-size:104% auto;transform:none;backdrop-filter:blur(16px) brightness(.62)}

</style></head><body><main class="scene" id="scene"><div class="panorama" id="panorama"></div><header class="topline"><div class="brand"><span class="seal">粤</span><span>岭南声音 · 线上展厅</span></div><div class="topmeta">GUANGDONG MUSIC MUSEUM / 01</div></header><section class="hero"><div class="eyebrow">LINGNAN MUSIC · DIGITAL MUSEUM</div><h1>广东音乐线上展厅</h1><p class="sub">从一段《步步高》，走近岭南丝竹</p></section><button class="enter" id="enter">进入展馆 <span>→</span></button><div class="toast" id="toast" role="status"></div></main><script>
const scene=document.querySelector("#scene"),pano=document.querySelector("#panorama"),toast=document.querySelector("#toast");let down=false,startX=0,offset=50;scene.addEventListener("pointerdown",e=>{if(e.target.closest("button,nav"))return;down=true;startX=e.clientX;scene.classList.add("dragging");scene.setPointerCapture(e.pointerId)});scene.addEventListener("pointermove",e=>{if(!down)return;offset=Math.max(0,Math.min(100,offset-(e.clientX-startX)/innerWidth*42));startX=e.clientX;pano.style.backgroundPosition=offset+"% 50%"});["pointerup","pointercancel","lostpointercapture"].forEach(event=>scene.addEventListener(event,()=>{down=false;scene.classList.remove("dragging")}));function announce(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(announce.timer);announce.timer=setTimeout(()=>toast.classList.remove("show"),1900)}document.querySelector("#enter").addEventListener("click",()=>location.assign("scene-05-secrets.html#classify"));
