<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182b23">
<title>广东音乐博物馆结语</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#14231d;color:#28271f;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
button{font:inherit}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;overflow:hidden;background:#e9e1d0}
.hall{position:absolute;inset:0;background:linear-gradient(90deg,#f4eee1f2 0%,#f0e9d9e8 38%,#ece3d2a1 58%,#10231c38 100%),url("scene-17-closing-hall.png") center 47%/cover no-repeat}
.hall:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0e211a55,transparent 25%,transparent 82%,#13251d2b);pointer-events:none}
.frame{position:absolute;inset:33px;border:1px solid #bba8779c;pointer-events:none}
.frame:after{content:"";position:absolute;inset:10px;border:1px solid #ffffff91}
.copy{position:absolute;z-index:2;left:9%;top:17%;width:53%;max-width:930px;color:#2f3128}
.kicker{margin:0 0 17px;color:#8d4b36;font-size:25px;letter-spacing:1px}
h1{margin:0 0 40px;font:500 56px/1.2 KaiTi,STKaiti,"Songti SC",serif;color:#253b30}
.rule{width:90px;height:3px;margin-bottom:32px;background:#a44836}
.message{max-width:900px;margin:0;font:400 40px/1.9 KaiTi,STKaiti,"Songti SC",serif;color:#31382f}
.message span{color:#8c4535}
.instrument-stage{position:absolute;z-index:1;right:6.4%;bottom:13%;width:31%;height:69%;display:flex;justify-content:center;align-items:end}
.instrument-stage:before{content:"";position:absolute;left:4%;right:4%;bottom:2.5%;height:19%;border:1px solid #d7bd806b;background:linear-gradient(180deg,#f5e7c51c,#08140e55);box-shadow:0 15px 38px #08100c27,inset 0 0 20px #e1bd6b1d;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.instrument-stage:after{content:"";position:absolute;left:0;right:0;bottom:2%;height:2px;background:#d8bd78a8;box-shadow:0 0 22px #f6d68b8c}
.gaohu{position:relative;z-index:1;height:98%;max-width:78%;object-fit:contain;filter:drop-shadow(0 16px 15px #08100d67)}
.caption{position:absolute;right:14%;bottom:9.8%;z-index:2;color:#fff1cf;font-size:24px;letter-spacing:2px}
.actions{position:absolute;z-index:3;left:9%;bottom:12.5%;display:flex;gap:17px;align-items:center}
.action{height:66px;padding:0 29px;border-radius:4px;border:1px solid #7c7a5d;background:#f7f0e2;color:#284134;font-size:25px;cursor:pointer;transition:background .18s,color .18s,transform .18s}
.action:hover{transform:translateY(-2px);background:#e9dfc9}
.action.primary{background:#295642;border-color:#295642;color:#fff8e8}
.action.primary:hover{background:#1e4433}
.footer{position:absolute;z-index:2;left:9%;right:9%;bottom:5.3%;display:flex;align-items:center;justify-content:space-between;color:#625f50;font-size:19px}
.footer .mark{display:flex;align-items:center;gap:10px}.mark:before{content:"";width:29px;height:1px;background:#a44836}
.end-screen{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#14271fee;color:#fff5dc;opacity:0;visibility:hidden;transition:opacity .45s}
.end-screen.show{opacity:1;visibility:visible}.end-inner{text-align:center}.end-inner p{margin:0;color:#d9c793;font-size:24px}.end-inner h2{margin:20px 0 32px;font:400 52px/1.35 KaiTi,STKaiti,"Songti SC",serif}.end-inner button{background:transparent;color:#fff4d5;border-color:#c5ad72}
[hidden]{display:none!important}
@media(max-width:700px) and (orientation:portrait){
body{overflow:hidden}.stage{width:100vw;height:100dvh;transform:none;left:0;top:0}.hall{background-image:linear-gradient(90deg,#f4eee1f2,#eee5d6da 56%,#14281d5c),url("scene-17-closing-hall.png");background-position:56% center}.frame{inset:12px}.copy{left:8%;top:10%;width:84%}.kicker{font-size:16px;margin-bottom:8px}h1{font-size:34px;margin-bottom:17px}.rule{margin-bottom:15px;width:56px}.message{font-size:23px;line-height:1.7}.instrument-stage{right:4%;bottom:16%;width:47%;height:44%}.gaohu{height:98%;max-width:75%}.caption{right:14%;bottom:13%;font-size:15px}.actions{left:8%;bottom:7.5%;gap:9px}.action{height:48px;padding:0 13px;font-size:16px}.footer{left:8%;right:8%;bottom:2.7%;font-size:12px}.mark:before{width:14px}.end-inner h2{font-size:34px}
}
@media(max-height:650px) and (orientation:landscape){.stage{width:100vw;height:100dvh;transform:none;left:0;top:0}.copy{top:12%}.message{font-size:32px;line-height:1.65}h1{font-size:46px;margin-bottom:25px}.instrument-stage{height:65%}.actions{bottom:10%}}
</style>
</head>
<body>
<main class="stage" id="stage">
<div class="hall" aria-hidden="true"></div><div class="frame" aria-hidden="true"></div>
<section class="copy" aria-labelledby="title">
<p class="kicker">广东音乐线上展厅 · 参观结束</p>
<h1 id="title">广东音乐博物馆结语</h1>
<div class="rule" aria-hidden="true"></div>
<p class="message">音乐会随时代变化，<br>但属于家乡的声音，<br><span>始终值得被听见、被理解、被传承。</span></p>
</section>
<figure class="instrument-stage" aria-label="高胡主视觉"><img class="gaohu" src="scene-03-display-gaohu.png" alt="广东音乐主奏乐器高胡"></figure>
<p class="caption">高胡 · 岭南的声音</p>
<nav class="actions" aria-label="结语操作">
<button class="action primary" id="restart" type="button">重新参观</button>
<button class="action" id="finish" type="button">结束本课</button>
</nav>
<footer class="footer"><span class="mark">广东音乐线上展厅</span><span>一弓一弦 · 声传岭南</span></footer>
<section class="end-screen" id="endScreen" role="status" aria-live="polite">
<div class="end-inner"><p>广东音乐线上展厅</p><h2>本课结束<br>谢谢聆听</h2><button class="action" id="back" type="button">返回结语</button></div>
</section>
</main>
<script>
const stage=document.getElementById("stage");
function fit(){stage.style.setProperty("--fit",Math.min(innerWidth/1920,innerHeight/1080))}
window.addEventListener("resize",fit);fit();
document.getElementById("restart").addEventListener("click",()=>{
  if(window.parent!==window)window.parent.postMessage({type:"museum-route",route:"entry"},"*");
  else location.href="scene-01-entry.html";
});
const end=document.getElementById("endScreen");
document.getElementById("finish").addEventListener("click",()=>{end.classList.add("show");document.getElementById("back").focus()});
document.getElementById("back").addEventListener("click",()=>{end.classList.remove("show");document.getElementById("finish").focus()});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&end.classList.contains("show"))document.getElementById("back").click()});
</script>
</body>
</html>
