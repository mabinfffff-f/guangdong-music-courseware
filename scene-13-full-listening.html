<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07100f">
<title>完整聆听与声波标记</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#07100f;color:#f3efdf;font-family:"Microsoft YaHei",system-ui,sans-serif}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 52% 43%,#12201e 0,#0b1514 43%,#060c0c 100%)}
.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 71% 21%,#233b3426,transparent 29%),radial-gradient(ellipse at 10% 80%,#1c2c2926,transparent 34%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
.topline{position:absolute;left:62px;right:62px;top:40px;display:flex;justify-content:space-between;align-items:center;color:#b8c0b7;font-size:22px}.topline-left{display:flex;align-items:center;gap:14px}.gold-dot{width:10px;height:10px;border-radius:50%;background:#d6c077;box-shadow:0 0 12px #dccb7955}.top-actions{display:flex;align-items:center;gap:18px;color:#aeb7ad}.round-tool{width:48px;height:48px;border:1px solid #86938b55;border-radius:50%;display:grid;place-items:center;background:#101a18;color:#d9ddcf}.round-tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
h1{position:absolute;left:112px;top:154px;margin:0;color:#f5f0df;font:400 70px/1.2 KaiTi,STKaiti,"Songti SC",serif}.subhead{position:absolute;left:116px;top:257px;margin:0;color:#d3d5c8;font-size:27px}.subhead em{font-style:normal;color:#e6d89e}
.player{position:absolute;left:112px;right:112px;top:354px;height:346px;border:1px solid #7a89805c;border-radius:8px;background:linear-gradient(120deg,#0e1a18e8,#0c1716f0);box-shadow:0 24px 60px #0004,inset 0 1px #ffffff09}
.track-title{position:absolute;left:178px;top:32px;color:#e8e5d7;font:500 28px/1.2 KaiTi,STKaiti,"Songti SC",serif}.track-meta{position:absolute;right:178px;top:37px;color:#9da99f;font-size:20px}.transport{position:absolute;left:42px;top:50%;width:104px;height:104px;transform:translateY(-50%);border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f3dda0,#c5a657);color:#17201c;cursor:pointer;box-shadow:0 7px 25px #ddc16c2b}.transport:hover{filter:brightness(1.08)}.transport svg{width:34px;height:34px;fill:currentColor}
.wave-area{position:absolute;left:174px;right:198px;top:105px;height:160px}.wave-canvas{display:block;width:100%;height:100%;cursor:crosshair}.wave-canvas:focus-visible{outline:2px solid #e5d397;outline-offset:4px}.time-row{position:absolute;left:174px;right:198px;bottom:35px;display:flex;justify-content:space-between;color:#abb4aa;font:500 19px/1.2 "Microsoft YaHei",sans-serif}.time-current{color:#e4d493}.star-action{position:absolute;right:42px;top:50%;transform:translateY(-50%);width:104px;height:104px;border:1px solid #9ca58b;border-radius:22px;background:#b6ad7140;color:#f2dfa0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 0 28px #e7d89212}.star-action:hover{background:#c4b57438;border-color:#e2d69e}.star-action:disabled{opacity:.45;cursor:not-allowed}.star-action svg{width:30px;height:30px;fill:currentColor;stroke:#f2dfa0;stroke-width:1}.star-action span{font-size:19px;color:#eee8d4}
.hint{position:absolute;left:112px;right:112px;top:728px;min-height:62px;display:flex;align-items:center;justify-content:center;color:#d7d8cc;font-size:24px;text-align:center}.hint strong{color:#e5d394;font-weight:500}.answer-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid #b6a76e80;border-radius:24px;background:#b6a76e12;color:#d8cb93;font:500 19px/1 "Microsoft YaHei",sans-serif;cursor:pointer;transition:background .2s,border-color .2s,color .2s}.answer-toggle:hover,.answer-toggle[aria-pressed="true"]{background:#b6a76e2a;border-color:#d8c783;color:#f0e2ad}.answer-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.marks-summary{position:absolute;left:112px;right:112px;top:790px;min-height:40px;display:flex;align-items:center;justify-content:center;color:#b4bdb2;font-size:21px}.marks-list{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}.mark-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #9195797a;border-radius:22px;background:#121d1a;color:#eddb9b;font:500 18px/1.2 "Microsoft YaHei",sans-serif;cursor:pointer}.mark-chip svg{width:17px;height:17px;fill:currentColor}.mark-chip:hover{background:#28302a}.empty-marks{color:#7f8e83}
.steps{position:absolute;left:112px;right:112px;top:850px;height:120px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.step-card{border:1px solid #77857b5c;border-radius:5px;background:#0c1716c9;display:flex;align-items:center;gap:25px;padding:0 30px}.step-num{color:#e7dcae;font:400 42px/1 Georgia,serif}.step-copy{display:flex;flex-direction:column;gap:8px}.step-title{color:#f0eddf;font-size:24px}.step-note{color:#9ea99e;font-size:18px}
.footer{position:absolute;left:62px;right:62px;bottom:28px;height:52px;display:flex;align-items:center;justify-content:space-between;color:#96a399;font-size:18px}.footer-brand{display:flex;align-items:center;gap:12px}.footer-brand .gold-dot{width:7px;height:7px}.progress{display:flex;align-items:center;gap:18px}.progress-dots{display:flex;align-items:center;gap:11px}.progress-dots i{display:block;width:9px;height:9px;border-radius:50%;background:#5a665f}.progress-dots i.current{width:13px;height:13px;background:#e1d39a;box-shadow:0 0 12px #dfd08d77}.page-count{color:#d7d7c8;letter-spacing:2px}
.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:13px 24px;border:1px solid #a59d71;border-radius:28px;background:#101916;color:#efe4b7;font-size:21px;transition:opacity .2s,transform .2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){h1{font-size:52px;top:14%}.subhead{font-size:19px;top:24%}.player{top:34%;height:32%}.steps{top:80%;height:11%;gap:10px}.step-card{padding:0 12px;gap:10px}.step-title{font-size:18px}.step-note{font-size:14px}.step-num{font-size:30px}.hint{top:68%;font-size:17px}.marks-summary{top:74%;font-size:15px}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="ambient"></div><div class="grain"></div>
  <header class="topline"><div class="topline-left"><span class="gold-dot"></span><span>广东音乐线上展厅 · 完整聆听</span></div><div class="top-actions"><span>步步高 · 听辨记录</span><button class="round-tool" id="fullscreen" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button></div></header>
  <h1>听完整乐曲 · 找熟悉的旋律</h1>
  <p class="subhead">完整聆听《步步高》。当你再次听到熟悉的旋律或骨干音动机时，请在声波上<strong>标记</strong>。</p>
  <section class="player" aria-label="《步步高》完整聆听播放器">
    <div class="track-title">广东音乐 ·《步步高》</div><div class="track-meta" id="trackMeta">完整聆听</div>
    <button class="transport" id="transport" type="button" aria-label="播放"><svg id="transportIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="wave-area"><canvas class="wave-canvas" id="wave" tabindex="0" role="slider" aria-label="乐曲声波时间轴，点击可跳转"></canvas></div>
    <div class="time-row"><span class="time-current" id="currentTime">00:00</span><span id="duration">--:--</span></div>
    <button class="star-action" id="mark" type="button" aria-label="在当前播放位置标记一次" disabled><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.44 1.08 6.27L12 17.15l-5.63 2.96 1.08-6.27L2.9 9.4l6.3-.9L12 2.8z"/></svg><span>记一次</span></button>
  </section>
  <div class="hint"><span><strong>听辨任务：</strong>&nbsp;留意主题旋律或骨干音动机再次出现的位置</span><button class="answer-toggle" id="answerToggle" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg><span>显示答案</span></button></div>
  <div class="marks-summary"><div class="marks-list" id="marksList"><span class="empty-marks">你的标记会显示在这里</span></div></div>
  <section class="steps" aria-label="聆听环节"><article class="step-card"><span class="step-num">01</span><div class="step-copy"><span class="step-title">完整聆听</span><span class="step-note">感受全曲的情绪与走向</span></div></article><article class="step-card"><span class="step-num">02</span><div class="step-copy"><span class="step-title">辨认旋律</span><span class="step-note">留意熟悉的主题再次出现</span></div></article><article class="step-card"><span class="step-num">03</span><div class="step-copy"><span class="step-title">主动标记</span><span class="step-note">依据自己的聆听判断记录</span></div></article></section>
  <footer class="footer"><div class="footer-brand"><span class="gold-dot"></span><span>聆听记录仅保留在当前页面</span></div><div class="progress"><div class="progress-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="current"></i><i></i></div><span class="page-count">13 / 18</span></div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata" src="scene-13-bubugao.mp3"></audio>
</main>
<script>
const stage=document.getElementById('stage');
const audio=document.getElementById('audio');
const canvas=document.getElementById('wave');
const ctx=canvas.getContext('2d');
const playButton=document.getElementById('transport');
const playIcon=document.getElementById('transportIcon');
const markButton=document.getElementById('mark');
const currentTimeLabel=document.getElementById('currentTime');
const durationLabel=document.getElementById('duration');
const marksList=document.getElementById('marksList');
const toast=document.getElementById('toast');
let marks=[];let peaks=[];let resizeObserver;let toastTimer;
let answerVisible=false;
function fit(){stage.style.setProperty('--fit',Math.min(innerWidth/1920,innerHeight/1080))}
function timeText(seconds){if(!Number.isFinite(seconds))return'00:00';const s=Math.floor(seconds);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function seeded(i){const x=Math.sin(i*127.1+19.19)*43758.5453;return x-Math.floor(x)}
function sizeCanvas(){const ratio=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(canvas.clientWidth*ratio));canvas.height=Math.max(1,Math.round(canvas.clientHeight*ratio));ctx.setTransform(ratio,0,0,ratio,0,0);drawWave()}
function buildPeaks(){const count=Math.max(900,Math.floor(canvas.clientWidth*1.25));peaks=[];for(let i=0;i<count;i++){const t=i/count;const envelope=.19+Math.pow(Math.abs(Math.sin(t*27+0.4)*Math.cos(t*11.8)),.7)*.57;const detail=.18+seeded(i)*.82;const accent=(i%97<8?.45:0)+(i%239<5?.22:0);peaks.push(Math.min(.96,envelope*detail+accent))}drawWave()}
function drawWave(){if(!ctx||!canvas.width)return;const ratio=devicePixelRatio||1;const w=canvas.width/ratio,h=canvas.height/ratio;ctx.clearRect(0,0,w,h);const mid=h/2;const progress=audio.duration?audio.currentTime/audio.duration:0;const activeX=w*progress;if(answerVisible&&audio.duration>89){const x1=w*(68/audio.duration),x2=w*(89/audio.duration),bandW=x2-x1;ctx.fillStyle='#d5bd7650';ctx.fillRect(x1,7,bandW,h-14);ctx.save();ctx.strokeStyle='#d9c782a8';ctx.lineWidth=1.4;ctx.setLineDash([5,7]);ctx.strokeRect(x1,7,bandW,h-14);ctx.setLineDash([]);ctx.fillStyle='#e6d79d';ctx.font='500 18px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor='#111a16';ctx.shadowBlur=5;ctx.fillText('主题旋律再现',x1+bandW/2,12);ctx.font='500 16px "Microsoft YaHei",sans-serif';ctx.textBaseline='bottom';ctx.textAlign='left';ctx.fillText('01:08',x1+6,h-12);ctx.textAlign='right';ctx.fillText('01:29',x2-6,h-12);ctx.restore()}const gap=2.3;const barW=Math.max(1.2,(w/peaks.length)-gap);for(let i=0;i<peaks.length;i++){const x=i/peaks.length*w;const amp=Math.max(3,peaks[i]*(h*.44));ctx.fillStyle=x<activeX?'#d9d4b2':'#78847a';ctx.globalAlpha=x<activeX?.9:.76;ctx.fillRect(x,mid-amp,barW,amp*2)}ctx.globalAlpha=1;for(const mark of marks){if(!audio.duration)continue;const ratioAt=mark.time/audio.duration;const x=w*ratioAt;ctx.strokeStyle='#e0cf88';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,5);ctx.lineTo(x,h-5);ctx.stroke();drawStar(x,mid-Math.max(ampAt(ratioAt)*h*.44,30)-18,8)}if(audio.duration){const x=activeX;ctx.strokeStyle='#eee3aa';ctx.shadowColor='#e3d28b';ctx.shadowBlur=9;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#f2dda0';ctx.beginPath();ctx.arc(x,mid,5,0,Math.PI*2);ctx.fill()}}
function ampAt(t){return peaks[Math.min(peaks.length-1,Math.floor(t*peaks.length))]||.4}
function drawStar(x,y,r){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2===0?r:r*.43;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle='#f0dc98';ctx.shadowColor='#eedc94';ctx.shadowBlur=10;ctx.fill();ctx.restore()}
function renderMarks(){marksList.replaceChildren();if(!marks.length){const empty=document.createElement('span');empty.className='empty-marks';empty.textContent='你的标记会显示在这里';marksList.append(empty);return}marks.forEach((m,index)=>{const b=document.createElement('button');b.type='button';b.className='mark-chip';b.title='点击回听此标记附近片段';b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.44 1.08 6.27L12 17.15l-5.63 2.96 1.08-6.27L2.9 9.4l6.3-.9L12 2.8z"/></svg><span>'+timeText(m.time)+'</span>';b.addEventListener('click',()=>replayMark(index));marksList.append(b)})}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
function setPlaying(playing){playButton.setAttribute('aria-label',playing?'暂停':'播放');playIcon.innerHTML=playing?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';document.getElementById('trackMeta').textContent=playing?'正在聆听':'完整聆听'}
async function togglePlay(){if(audio.paused){try{await audio.play()}catch{showToast('音频暂时无法播放，请确认音频文件与网页在同一文件夹')}}else audio.pause()}
function addMark(){if(!Number.isFinite(audio.duration)||!audio.duration){showToast('请先开始播放，再记录听到的位置');return}const time=audio.currentTime;if(marks.some(m=>Math.abs(m.time-time)<2)){showToast('这个位置已经标记过了');return}marks.push({time});marks.sort((a,b)=>a.time-b.time);renderMarks();drawWave();showToast('已记录 '+timeText(time)+'，点击声波星标可回听')}
function seekAt(event){if(!audio.duration)return;const rect=canvas.getBoundingClientRect();const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));const nearIndex=marks.findIndex(m=>Math.abs(m.time/audio.duration-ratio)*rect.width<22);if(nearIndex>=0){replayMark(nearIndex);return}audio.currentTime=ratio*audio.duration;if(audio.paused){drawWave();currentTimeLabel.textContent=timeText(audio.currentTime)}}
async function replayMark(index){const m=marks[index];const next=marks[index+1];audio.currentTime=Math.max(0,m.time-3);try{await audio.play();if(next){const stopAt=next.time+3;const stop=()=>{if(audio.currentTime>=stopAt){audio.pause();audio.removeEventListener('timeupdate',stop)}};audio.addEventListener('timeupdate',stop)}}catch{showToast('音频暂时无法播放，请确认音频文件与网页在同一文件夹')}}
playButton.addEventListener('click',togglePlay);markButton.addEventListener('click',addMark);document.getElementById('answerToggle').addEventListener('click',e=>{answerVisible=!answerVisible;e.currentTarget.setAttribute('aria-pressed',String(answerVisible));e.currentTarget.lastElementChild.textContent=answerVisible?'隐藏答案':'显示答案';drawWave()});canvas.addEventListener('click',seekAt);canvas.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+(e.key==='ArrowRight'?5:-5)))}});document.getElementById('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()});
audio.addEventListener('loadedmetadata',()=>{durationLabel.textContent=timeText(audio.duration);markButton.disabled=false;buildPeaks();drawWave()});audio.addEventListener('timeupdate',()=>{currentTimeLabel.textContent=timeText(audio.currentTime);drawWave()});audio.addEventListener('play',()=>setPlaying(true));audio.addEventListener('pause',()=>setPlaying(false));audio.addEventListener('ended',()=>{setPlaying(false);showToast(marks.length?'聆听结束，已保留你的标记':'聆听结束。你还没有添加标记')});audio.addEventListener('error',()=>showToast('找不到音频文件，请将 scene-13-bubugao.mp3 与网页放在同一文件夹'));
addEventListener('resize',()=>{fit();sizeCanvas();buildPeaks()});fit();sizeCanvas();buildPeaks();renderMarks();
</script>
</body>
</html>
